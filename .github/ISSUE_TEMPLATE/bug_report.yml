name: 🐛 Bug Report
description: Report a reproducible bug in Teleproto
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below to help us reproduce and resolve the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce / Code Example
      description: Provide a minimal code snippet reproducing the issue.
      placeholder: |
        ```php
        use MeRezaRezaei\Teleproto\Facades\TP;

        $res = TP::bot()->sendMessage(...);
        ```
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: PHP Version
      options:
        - PHP 8.2
        - PHP 8.3
        - PHP 8.4
    validations:
      required: true

  - type: textarea
    id: stacktrace
    attributes:
      label: Stack Trace / Error Output
      description: Paste any error messages or stack traces if available.
